<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>미림 랜선 검사실 — LAN Cable Lab</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div id="app">
    <header class="booth">
      <div class="booth-mark">MIRIM · UTP</div>
      <h1>미림마이스터고 · 랜선 검사실</h1>
      <button type="button" id="btn-reset" class="ghost hidden">새 의뢰</button>
    </header>

    <section id="ticket" class="ticket" aria-label="작업지시서"></section>

    <section id="cable-strip" class="cable-strip" aria-label="케이블 상태"></section>

    <main id="desk">
      <div id="stage" class="stage" role="application" aria-label="작업대"></div>
    </main>

    <footer id="dock">
      <p id="prompt"></p>
      <button type="button" id="btn-primary" class="primary hidden"></button>
    </footer>
  </div>

  <div id="inspect-sheet" class="sheet hidden" role="dialog" aria-label="재킷 인쇄"></div>
  <div id="stamp-layer" class="stamp-layer hidden" role="status"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
